services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: elation
      POSTGRES_PASSWORD: elation
      POSTGRES_DB: elation
    ports:
      # 55432 on the host: avoids clashing with locally installed Postgres (5432, 5433)
      - "${DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elation"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
